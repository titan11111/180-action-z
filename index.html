<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no,
           viewport-fit=cover">
<title>アクションゲームZ</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: none;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    font-family: "Hiragino Sans", "Helvetica Neue", sans-serif;
  }

  #screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #5c94fc;
  }

  /* ===== HUD ===== */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== タイトル / ゴール オーバーレイ ===== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 32px;
    margin: 0 0 8px;
    text-shadow: 3px 3px 0 #d43;
    letter-spacing: 2px;
  }
  #overlay p { margin: 4px 0; font-size: 15px; opacity: 0.9; }
  #overlay button {
    margin-top: 22px;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: bold;
    border: 3px solid #fff;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    touch-action: manipulation;
  }
  #overlay button:active { background: #c23350; }

  /* ===== ファミコン風コントローラー（下段30%） ===== */
  #controller {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 30vh;
    min-height: 150px;
    background: linear-gradient(#3a3f52, #23262f);
    border-top: 3px solid #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(22px + env(safe-area-inset-left));
    padding-right: calc(22px + env(safe-area-inset-right));
    z-index: 10;
  }

  /* 十字キー（左） */
  .dpad {
    position: relative;
    width: 170px;
    height: 170px;
    flex-shrink: 0;
  }
  .dpad button {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #d8d8dc;
    border: 2px solid #16161a;
    color: #16161a;
    font-size: 24px;
    font-weight: bold;
    border-radius: 6px;
    padding: 0;
  }
  .dpad button:active { background: #9a9aa0; }
  #cv-up    { top: 0;   left: 57px; border-radius: 6px 6px 0 0; }
  #cv-down  { bottom: 0; left: 57px; border-radius: 0 0 6px 6px; }
  #cv-left  { top: 57px; left: 0;   border-radius: 6px 0 0 6px; }
  #cv-right { top: 57px; right: 0;  border-radius: 0 6px 6px 0; }

  /* A/Bボタン（右）: 右から A → B の並び */
  .action-btns {
    display: flex;
    flex-direction: row-reverse; /* 最初の要素(A)が右端に来る */
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .action-btns button {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #e94560;
    border: 3px solid #7a1830;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    padding: 0;
  }
  .action-btns button:active { background: #b82f45; }
  .action-btns small { font-size: 10px; font-weight: normal; }
  #cv-b { background: #4b6cb7; border-color: #223a6b; margin-top: 18px; }
  #cv-b:active { background: #33508f; }

  #mash-gauge-wrap {
    position: absolute;
    bottom: calc(30vh + 8px);
    right: 22px;
    width: 90px;
    height: 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid #fff;
    border-radius: 5px;
    overflow: hidden;
    z-index: 6;
  }
  #mash-gauge {
    height: 100%;
    width: 0%;
    background: #4b6cb7;
  }

  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }
  @media (orientation: landscape) {
    #rotate-overlay { display: none; }
  }
  #rotate-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #000; color: #fff;
    flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 1.1rem; text-align: center;
    padding: 0 24px;
  }
</style>
    <meta property="og:title" content="アクションゲームZ">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/180-action-z/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
</head>
<body>

<div id="screen">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div>四字熟語: <span id="collectedWord">----</span></div>
    <div id="modeLabel"></div>
  </div>

  <div id="mash-gauge-wrap"><div id="mash-gauge"></div></div>

  <div id="overlay">
    <h1>アクションゲームZ</h1>
    <p>← → で移動 / 十字下でしゃがみ</p>
    <p>A ボタンでジャンプ / B ボタン連打でねこが覚醒モード！</p>
    <p>漢字を4つ集めて、正しい順番で四字熟語を完成させよう</p>
    <button id="startBtn" type="button">スタート</button>
  </div>

  <div id="controller">
    <div class="dpad">
      <button type="button" id="cv-up">▲</button>
      <button type="button" id="cv-down">▼</button>
      <button type="button" id="cv-left">◀</button>
      <button type="button" id="cv-right">▶</button>
    </div>
    <div class="action-btns">
      <button type="button" id="cv-a">A<small>ジャンプ</small></button>
      <button type="button" id="cv-b">B<small>連打で覚醒</small></button>
    </div>
  </div>

  <div id="rotate-overlay">
    端末を横向きにしてください<br><small>Please rotate your device</small>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     ダブルタップ防止
  ========================================================= */
  let lastTap = 0;
  document.addEventListener('touchstart', e => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* =========================================================
     WebAudio（効果音: ジャンプ / 取得 / 覚醒モード）
  ========================================================= */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function unlockAudio() {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
  }
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });

  function beep(freq, dur, type, vol, delaySec) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime + (delaySec || 0);
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol == null ? 0.08 : vol;
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      gain.gain.setValueAtTime(gain.gain.value, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.stop(t0 + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }
  function noiseHit(dur, vol, delaySec) {
    try {
      const ctx = getAudioCtx();
      const t0 = ctx.currentTime + (delaySec || 0);
      const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      src.buffer = buf;
      gain.gain.value = vol == null ? 0.06 : vol;
      src.connect(gain).connect(ctx.destination);
      src.start(t0);
      gain.gain.setValueAtTime(gain.gain.value, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      src.stop(t0 + dur + 0.01);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  // 中国風ペンタトニック（宮調）寄りの音階
  const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  const BGM_BPM = 136;
  const BGM_STEP_MS = (60000 / BGM_BPM) / 2; // 8分音符
  const BGM_MELODY = [0, 2, 3, 2, 4, 3, 2, 0, 2, 3, 4, 3, 2, 0, 2, -1];
  const BGM_BASS =   [0,-1,-1,-1, 3,-1,-1,-1, 4,-1,-1,-1, 3,-1,-1,-1];
  let bgmStep = 0;
  let bgmTimer = 0;

  function playBgmStep() {
    const m = BGM_MELODY[bgmStep % BGM_MELODY.length];
    const b = BGM_BASS[bgmStep % BGM_BASS.length];
    if (m >= 0) {
      beep(PENTA[m], 0.14, 'square', 0.045);
      // うっすら5度で厚み
      beep(PENTA[m] * 1.5, 0.08, 'square', 0.018, 0.01);
    }
    if (b >= 0) {
      beep(PENTA[b] * 0.5, 0.22, 'triangle', 0.04);
    }
    if (bgmStep % 4 === 2) {
      noiseHit(0.035, 0.03);
    }
    bgmStep = (bgmStep + 1) % BGM_MELODY.length;
  }

  function updateBgm(dt) {
    if (gameState !== 'playing') return;
    if (!audioCtx || audioCtx.state !== 'running') return;
    bgmTimer -= dt;
    while (bgmTimer <= 0) {
      playBgmStep();
      bgmTimer += BGM_STEP_MS;
    }
  }

  const sfx = {
    jump:  () => { beep(392, 0.08, 'square', 0.08); beep(523.25, 0.13, 'square', 0.075, 0.04); },
    item:  () => { beep(659.25, 0.08, 'square', 0.08); beep(783.99, 0.08, 'triangle', 0.08, 0.05); beep(987.77, 0.1, 'triangle', 0.075, 0.11); },
    key:   () => { beep(659.25, 0.08, 'square', 0.08); beep(783.99, 0.08, 'triangle', 0.08, 0.05); beep(987.77, 0.1, 'triangle', 0.075, 0.11); },
    mash:  () => beep(660, 0.22, 'sawtooth', 0.10),
    hitWrong: () => { noiseHit(0.06, 0.055); beep(220, 0.07, 'square', 0.045); },
    goal:  () => {
      beep(392.0, 0.13, 'square', 0.08, 0.00);
      beep(523.25, 0.13, 'square', 0.08, 0.12);
      beep(659.25, 0.16, 'square', 0.085, 0.24);
      beep(783.99, 0.25, 'triangle', 0.09, 0.42);
    },
  };

  /* =========================================================
     入力
  ========================================================= */
  const K = {};
  const KB_TO_LOGICAL = { Space: 'KeyA_BTN', KeyZ: 'KeyA_BTN', KeyX: 'KeyB_BTN' };
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    K[e.code] = true;
    if (KB_TO_LOGICAL[e.code]) K[KB_TO_LOGICAL[e.code]] = true;
  });
  document.addEventListener('keyup', e => {
    K[e.code] = false;
    if (KB_TO_LOGICAL[e.code]) K[KB_TO_LOGICAL[e.code]] = false;
  });

  function bindPointer(el, codes) {
    if (!el) return;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      codes.forEach(c => { K[c] = true; });
      unlockAudio();
    });
    el.addEventListener('pointerup',     () => { codes.forEach(c => { K[c] = false; }); });
    el.addEventListener('pointercancel', () => { codes.forEach(c => { K[c] = false; }); });
    el.addEventListener('lostpointercapture', () => { codes.forEach(c => { K[c] = false; }); });
  }

  function initVirtualControls() {
    bindPointer(document.getElementById('cv-left'),  ['ArrowLeft']);
    bindPointer(document.getElementById('cv-right'), ['ArrowRight']);
    bindPointer(document.getElementById('cv-up'),    ['ArrowUp']);
    bindPointer(document.getElementById('cv-down'),  ['ArrowDown']);
    bindPointer(document.getElementById('cv-a'),     ['KeyA_BTN', 'Space']);
    bindPointer(document.getElementById('cv-b'),     ['KeyB_BTN']);
  }
  initVirtualControls();

  /* =========================================================
     Canvas / DPR
  ========================================================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const CONTROL_PANEL_RATIO = 0.30;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = Math.max(260, Math.floor(window.innerHeight * (1 - CONTROL_PANEL_RATIO)));
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  /* =========================================================
     スプライトシート（5x5: 1歩行 2ジャンプ 3しゃがみ 4アイテム取得 5覚醒モード）
  ========================================================= */
  const sheet = new Image();
  sheet.src = 'cat-sprite.png';
  const shinigamiImg = new Image();
  const SHINIGAMI_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8f8f95"/>
      <stop offset="100%" stop-color="#2a2a32"/>
    </radialGradient>
  </defs>
  <path d="M20 66q8-34 28-34t28 34q-11 8-28 8t-28-8z" fill="url(#g)"/>
  <circle cx="48" cy="28" r="17" fill="#f2f2f6"/>
  <circle cx="42" cy="27" r="4" fill="#111"/>
  <circle cx="54" cy="27" r="4" fill="#111"/>
  <path d="M39 36q9 7 18 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M13 44l22 8-12 10z" fill="#3d3d45"/>
  <path d="M83 44l-22 8 12 10z" fill="#3d3d45"/>
  <path d="M74 17c8 2 11 8 9 14-3 8-13 11-20 8 7-1 11-4 13-8 2-4 0-9-2-14z" fill="#eaeaea"/>
</svg>`;
  shinigamiImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(SHINIGAMI_SVG);
  const SHEET_SIZE = 1024;
  const COLS = 5, ROWS = 5;
  const FRAME = SHEET_SIZE / COLS; // 204.8

  const ANIM = { WALK: 0, JUMP: 1, CROUCH: 2, ITEM: 3, MASH: 4 };

  /* =========================================================
     ワールド定義
  ========================================================= */
  const GRAVITY = 0.62;
  const JUMP_V = -13.4 * 1.5;
  const MOVE_SPEED = 3.1;
  const MASH_SPEED_MUL = 1.55;
  const GROUND_Y = 420; // ワールド座標での地面上端
  const PLAYER_SCALE = 1.2;
  const PLAYER_SIZE = 66 * PLAYER_SCALE;
  const SHOT_INTERVAL = 420; // 発射数を抑える
  const SHOT_SPEED = 11.5 * 0.5;
  const SHOT_LIFE = 850;
  const SHOT_Y_OFFSET = 10; // 発射位置を下げる（約1cm相当）
  const SHOT_RADIUS = 15; // 3倍サイズ

  // 地形: {x,w,y,h} y=上端。 通常地面 + 浮島 + 崖ギャップ
  const platforms = [
    { x: -50,  w: 480,  y: GROUND_Y, h: 400 },
    { x: 560,  w: 260,  y: GROUND_Y, h: 400 },
    { x: 900,  w: 160,  y: GROUND_Y - 90, h: 20 },
    { x: 1140, w: 380,  y: GROUND_Y, h: 400 },
    { x: 1650, w: 140,  y: GROUND_Y - 130, h: 20 },
    { x: 1900, w: 140,  y: GROUND_Y - 60,  h: 20 },
    { x: 2140, w: 520,  y: GROUND_Y, h: 400 },
    { x: 2760, w: 180,  y: GROUND_Y - 100, h: 20 },
    { x: 3020, w: 700,  y: GROUND_Y, h: 400 },
  ];
  const LEVEL_WIDTH = 3720;
  const GOAL_X = 3600;

  const ITEM_POINTS = [
    { x: 300,  y: GROUND_Y - 60 },
    { x: 640,  y: GROUND_Y - 60 },
    { x: 970,  y: GROUND_Y - 150 },
    { x: 1220, y: GROUND_Y - 60 },
    { x: 1400, y: GROUND_Y - 60 },
    { x: 1710, y: GROUND_Y - 190 },
    { x: 1960, y: GROUND_Y - 120 },
    { x: 2220, y: GROUND_Y - 60 },
    { x: 2450, y: GROUND_Y - 60 },
    { x: 2820, y: GROUND_Y - 160 },
    { x: 3100, y: GROUND_Y - 60 },
    { x: 3300, y: GROUND_Y - 60 },
  ];
  const items = [];

  const YOJI_POOL = [
    { word: '一石二鳥', meaning: '一つの行動で二つの利益を得ること。' },
    { word: '異口同音', meaning: '多くの人が同じことを言うこと。' },
    { word: '以心伝心', meaning: '言葉にしなくても気持ちが通じ合うこと。' },
    { word: '十人十色', meaning: '人それぞれ考え方や好みが違うこと。' },
    { word: '温故知新', meaning: '昔のことを学び、新しい知識を得ること。' },
    { word: '試行錯誤', meaning: 'いろいろ試しながら工夫して解決すること。' },
    { word: '創意工夫', meaning: '新しい考えで、よりよくするために工夫すること。' },
    { word: '一期一会', meaning: '出会いを一生に一度の大切な機会として大事にすること。' },
    { word: '言行一致', meaning: '言ったことと行動が一致していること。' },
    { word: '一喜一憂', meaning: '少しのことで喜んだり心配したりすること。' },
    { word: '一長一短', meaning: '良い点も悪い点もあること。' },
    { word: '臨機応変', meaning: 'その場の状況に合わせてうまく対応すること。' },
  ];
  const DECOY_KANJI_POOL = '上下左右中大小天気花草木林森海空雨雪火水土金学校先生文字音楽犬猫鳥白黒赤青早朝昼夜春夏秋冬'.split('');
  const QUIZ_CHAR_COUNT = 4;
  const DECOY_COUNT = 4;
  let currentQuestion = YOJI_POOL[0];
  let collectedChars = [];

  const clouds = [];
  for (let i = 0; i < 10; i++) {
    clouds.push({ x: i * 420 + Math.random() * 150, y: 60 + Math.random() * 140, s: 0.7 + Math.random() * 0.8 });
  }
  const sparkles = [];
  for (let i = 0; i < 18; i++) {
    sparkles.push({
      x: Math.random() * LEVEL_WIDTH,
      y: 45 + Math.random() * 180,
      tw: Math.random() * Math.PI * 2,
      sp: 0.0018 + Math.random() * 0.0018,
      r: 1.2 + Math.random() * 1.8,
    });
  }

  /* =========================================================
     プレイヤー状態
  ========================================================= */
  const player = {
    x: 40, y: GROUND_Y - PLAYER_SIZE, w: PLAYER_SIZE, h: PLAYER_SIZE,
    vx: 0, vy: 0,
    grounded: false,
    facing: 1,      // 1: 右向き, -1: 左向き
    animTimer: 0,
    animFrame: 0,
    state: 'walk',  // walk | jump | crouch
    itemGlowT: 0,
    mashModeT: 0,
  };

  let gameState = 'title'; // title | playing | fail_anim | success_anim | goal
  let camX = 0;
  let shotTimer = 0;
  const shots = [];
  const flyingChars = [];
  let failAnimTimer = 0;
  let failOverlayText = '';
  let successAnimTimer = 0;
  let successOverlayText = '';
  const fireRockets = [];
  const fireParticles = [];
  let fireLaunchTimer = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function updateCollectedHud() {
    const txt = collectedChars.join('').padEnd(4, '-');
    document.getElementById('collectedWord').textContent = txt;
  }

  function setupQuestion() {
    currentQuestion = YOJI_POOL[Math.floor(Math.random() * YOJI_POOL.length)];
    collectedChars = [];
    updateCollectedHud();

    const answerChars = currentQuestion.word.split('');
    const answerSet = new Set(answerChars);
    const decoyCandidates = DECOY_KANJI_POOL.filter(ch => !answerSet.has(ch));
    const decoyChars = shuffle(decoyCandidates).slice(0, DECOY_COUNT);
    const pointPool = ITEM_POINTS.slice().sort((a, b) => a.x - b.x);

    // 正解4文字は必ず左→右の4区間に分けて順序どおり配置する
    // （1文字目が終盤に出る問題を防ぐ）
    const answerSlots = [];
    const segSize = Math.max(1, Math.floor(pointPool.length / answerChars.length));
    for (let i = 0; i < answerChars.length; i++) {
      const segStart = i * segSize;
      const segEnd = (i === answerChars.length - 1)
        ? pointPool.length - 1
        : Math.min(pointPool.length - 1, (i + 1) * segSize - 1);
      const slot = randInt(segStart, segEnd);
      answerSlots.push(slot);
    }

    // 残りスロットに不正解文字をランダム配置
    const allSlots = Array.from({ length: pointPool.length }, (_, i) => i);
    const decoySlots = shuffle(allSlots.filter(i => !answerSlots.includes(i))).slice(0, decoyChars.length);

    items.length = 0;
    for (let i = 0; i < answerChars.length; i++) {
      const p = pointPool[answerSlots[i]];
      items.push({
        x: p.x,
        y: p.y,
        char: answerChars[i],
        isDecoy: false,
        taken: false,
      });
    }
    for (let i = 0; i < decoyChars.length; i++) {
      const p = pointPool[decoySlots[i]];
      items.push({
        x: p.x,
        y: p.y,
        char: decoyChars[i],
        isDecoy: true,
        taken: false,
      });
    }
    items.sort((a, b) => a.x - b.x);
  }

  // 覚醒モード（Bボタン連打）検知
  let prevB = false;
  const mashPresses = [];
  const MASH_WINDOW = 900;
  const MASH_THRESHOLD = 4;
  const MASH_MODE_DURATION = 3200;

  function updateMashDetection(dt) {
    const bDown = !!K['KeyB_BTN'];
    if (bDown && !prevB) {
      const now = performance.now();
      mashPresses.push(now);
      while (mashPresses.length && now - mashPresses[0] > MASH_WINDOW) mashPresses.shift();
      if (mashPresses.length >= MASH_THRESHOLD && player.mashModeT <= 0) {
        player.mashModeT = MASH_MODE_DURATION;
        sfx.mash();
        mashPresses.length = 0;
      }
    }
    prevB = bDown;

    const gaugeEl = document.getElementById('mash-gauge');
    if (player.mashModeT > 0) {
      gaugeEl.style.width = '100%';
      gaugeEl.style.background = '#7fd3ff';
    } else {
      const now = performance.now();
      while (mashPresses.length && now - mashPresses[0] > MASH_WINDOW) mashPresses.shift();
      gaugeEl.style.width = Math.min(100, (mashPresses.length / MASH_THRESHOLD) * 100) + '%';
      gaugeEl.style.background = '#4b6cb7';
    }

    if (player.mashModeT > 0) {
      player.mashModeT -= dt;
      if (player.mashModeT < 0) player.mashModeT = 0;
    }
  }

  /* =========================================================
     衝突判定（簡易AABB・上面着地のみ）
  ========================================================= */
  function resolveGround() {
    player.grounded = false;
    for (const p of platforms) {
      const withinX = player.x + player.w * 0.5 > p.x && player.x + player.w * 0.5 < p.x + p.w;
      const feetY = player.y + player.h;
      if (withinX && player.vy >= 0 && feetY >= p.y && feetY <= p.y + 24) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  function checkItems() {
    if (collectedChars.length >= QUIZ_CHAR_COUNT) return;
    for (const it of items) {
      if (it.taken) continue;
      const dx = (player.x + player.w / 2) - it.x;
      const dy = (player.y + player.h / 2) - it.y;
      if (Math.abs(dx) < 42 && Math.abs(dy) < 42) {
        it.taken = true;
        collectedChars.push(it.char);
        updateCollectedHud();
        player.itemGlowT = 500;
        sfx.key();
        if (collectedChars.length >= QUIZ_CHAR_COUNT) return;
      }
    }
  }

  function spawnShot() {
    const muzzleX = player.x + (player.facing === 1 ? player.w * 0.98 : player.w * 0.02);
    const muzzleY = player.y + player.h * 0.48 + SHOT_Y_OFFSET;
    shots.push({
      x: muzzleX,
      y: muzzleY,
      vx: player.facing * SHOT_SPEED,
      life: SHOT_LIFE,
      r: SHOT_RADIUS,
    });
  }

  function spawnFlyingChar(it, hitFromX) {
    const launchDir = it.x >= hitFromX ? 1 : -1;
    flyingChars.push({
      char: it.char,
      x: it.x,
      y: it.y,
      vx: (2.4 + Math.random() * 2.2) * launchDir,
      vy: -4.8 - Math.random() * 3.2,
      rot: 0,
      vr: (Math.random() * 0.4 + 0.18) * (Math.random() < 0.5 ? -1 : 1),
      life: 1100,
      ttl: 1100,
      size: 42 + Math.random() * 8,
    });
  }

  function updateShots(dt) {
    // B連打で覚醒中のみショット発射
    if (player.mashModeT > 0) {
      shotTimer -= dt;
      if (shotTimer <= 0) {
        spawnShot();
        shotTimer = SHOT_INTERVAL;
      }
    } else {
      shotTimer = 0;
    }

    for (let i = shots.length - 1; i >= 0; i--) {
      const b = shots[i];
      b.x += b.vx;
      b.life -= dt;
      if (b.life <= 0 || b.x < -100 || b.x > LEVEL_WIDTH + 100) {
        shots.splice(i, 1);
        continue;
      }
      for (const it of items) {
        if (it.taken || !it.isDecoy) continue;
        const dx = b.x - it.x;
        const dy = b.y - it.y;
        if (Math.abs(dx) < 26 && Math.abs(dy) < 26) {
          it.taken = true;
          spawnFlyingChar(it, b.x);
          shots.splice(i, 1);
          sfx.hitWrong();
          break;
        }
      }
    }
  }

  function updateFlyingChars(dt) {
    for (let i = flyingChars.length - 1; i >= 0; i--) {
      const fc = flyingChars[i];
      fc.x += fc.vx;
      fc.y += fc.vy;
      fc.vy += 0.22;
      fc.rot += fc.vr * (dt / 16.6667);
      fc.life -= dt;
      if (fc.life <= 0 || fc.y > GROUND_Y + 120) flyingChars.splice(i, 1);
    }
  }

  function spawnFireRocket() {
    const baseY = H * 0.70;
    const launchX = W * (0.18 + Math.random() * 0.64);
    fireRockets.push({
      x: launchX,
      y: baseY + Math.random() * 20,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -(4.8 + Math.random() * 1.8),
      life: 520 + Math.random() * 180,
      hue: Math.floor(Math.random() * 360),
    });
  }

  function burstFirework(x, y, hue) {
    const count = 32 + Math.floor(Math.random() * 16);
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.18;
      const sp = 1.2 + Math.random() * 3.2;
      fireParticles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 600 + Math.random() * 420,
        ttl: 600 + Math.random() * 420,
        hue: (hue + Math.floor(Math.random() * 80) - 20 + 360) % 360,
        sz: 2 + Math.random() * 2.8,
      });
    }
  }

  function updateFireworks(dt) {
    fireLaunchTimer -= dt;
    if (fireLaunchTimer <= 0) {
      spawnFireRocket();
      fireLaunchTimer = 160 + Math.random() * 140;
    }

    for (let i = fireRockets.length - 1; i >= 0; i--) {
      const r = fireRockets[i];
      r.x += r.vx;
      r.y += r.vy;
      r.vy += 0.02;
      r.life -= dt;
      if (r.life <= 0 || r.vy > -0.8) {
        burstFirework(r.x, r.y, r.hue);
        fireRockets.splice(i, 1);
      }
    }

    for (let i = fireParticles.length - 1; i >= 0; i--) {
      const p = fireParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.vx *= 0.992;
      p.life -= dt;
      if (p.life <= 0) fireParticles.splice(i, 1);
    }
  }

  /* =========================================================
     更新
  ========================================================= */
  let lastT = performance.now();

  function update(dt) {
    if (gameState === 'success_anim') {
      updateMashDetection(dt);
      updateBgm(dt);
      updateShots(dt);
      updateFlyingChars(dt);
      updateFireworks(dt);
      successAnimTimer -= dt;
      if (successAnimTimer <= 0) {
        gameState = 'goal';
        showOverlay('🎉 正解！', successOverlayText, 'つぎの問題へ');
      }
      return;
    }

    if (gameState === 'fail_anim') {
      updateMashDetection(dt);
      updateBgm(dt);
      updateShots(dt);
      updateFlyingChars(dt);
      failAnimTimer -= dt;
      if (failAnimTimer <= 0) {
        gameState = 'goal';
        showOverlay('ざんねん…', failOverlayText, 'リトライ');
      }
      return;
    }

    updateMashDetection(dt);
    updateBgm(dt);

    const left = !!K['ArrowLeft'];
    const right = !!K['ArrowRight'];
    const down = !!K['ArrowDown'];
    const jumpPressed = !!K['KeyA_BTN'];

    const speed = MOVE_SPEED * (player.mashModeT > 0 ? MASH_SPEED_MUL : 1);
    let moving = false;

    if (left && !right) { player.vx = -speed; player.facing = -1; moving = true; }
    else if (right && !left) { player.vx = speed; player.facing = 1; moving = true; }
    else { player.vx = 0; }

    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x > LEVEL_WIDTH - player.w) player.x = LEVEL_WIDTH - player.w;

    // 重力
    player.vy += GRAVITY;
    player.y += player.vy;
    resolveGround();

    // ジャンプ（Aボタン / Space）
    if (jumpPressed && player.grounded) {
      player.vy = JUMP_V;
      player.grounded = false;
      sfx.jump();
    }

    // 落下したら復帰
    if (player.y > 900) {
      player.x = 40; player.y = GROUND_Y - PLAYER_SIZE; player.vx = 0; player.vy = 0;
    }

    updateShots(dt);
    updateFlyingChars(dt);
    checkItems();

    // 状態決定（優先度: アイテム取得 > 覚醒モード > ジャンプ > しゃがみ > 歩行）
    if (player.itemGlowT > 0) {
      player.itemGlowT -= dt;
      player.state = 'item';
    } else if (player.mashModeT > 0) {
      player.state = 'mash';
    } else if (!player.grounded) {
      player.state = 'jump';
    } else if (down && !moving) {
      player.state = 'crouch';
    } else {
      player.state = 'walk';
    }

    // アニメーションフレーム送り
    const animSpeed = moving ? 90 : 220;
    player.animTimer += dt;
    if (player.animTimer > animSpeed) {
      player.animTimer = 0;
      player.animFrame = (player.animFrame + 1) % COLS;
    }
    if (player.state === 'walk' && !moving) player.animFrame = 0; // 立ち止まりは1コマ目

    document.getElementById('modeLabel').textContent = player.mashModeT > 0 ? '✨覚醒モード✨' : '';

    // カメラ
    const targetCamX = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.4));
    camX += (targetCamX - camX) * 0.15;

    // ゴール判定
    if (gameState === 'playing' && player.x >= GOAL_X) {
      gameState = 'goal';
      sfx.goal();
      const answer = collectedChars.join('');
      const ok = answer === currentQuestion.word;
      if (ok) {
        successOverlayText = `すごい！ 完璧です！\n${currentQuestion.word}\n${currentQuestion.meaning}`;
        gameState = 'success_anim';
        successAnimTimer = 3300;
        fireLaunchTimer = 0;
        fireRockets.length = 0;
        fireParticles.length = 0;
      } else {
        failOverlayText = `もう一度やり直し！\n集めた順: ${answer || '（未取得）'}\n正解: ${currentQuestion.word}`;
        gameState = 'fail_anim';
        failAnimTimer = 2500;
      }
    }
  }

  /* =========================================================
     描画
  ========================================================= */
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6bb8ff');
    g.addColorStop(1, '#d8f1ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 太陽のグロー
    const sunX = W * 0.82;
    const sunY = 70;
    const sunG = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 90);
    sunG.addColorStop(0, 'rgba(255,245,170,0.85)');
    sunG.addColorStop(1, 'rgba(255,245,170,0)');
    ctx.fillStyle = sunG;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 92, 0, Math.PI * 2);
    ctx.fill();

    // 遠景のゆるい山シルエット
    ctx.fillStyle = 'rgba(120,180,210,0.34)';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 24) {
      const y = H * 0.64 + Math.sin((x + camX * 0.18) * 0.010) * 16;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(90,150,190,0.26)';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 28) {
      const y = H * 0.70 + Math.sin((x + camX * 0.27) * 0.014 + 1.5) * 12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    for (const c of clouds) {
      const sx = c.x - camX * 0.4;
      if (sx < -120 || sx > W + 120) continue;
      drawCloud(sx, c.y, c.s);
    }

    // きらめき（控えめ）
    const now = performance.now();
    for (const s of sparkles) {
      const sx = s.x - camX * 0.22;
      if (sx < -20 || sx > W + 20) continue;
      const a = 0.2 + (Math.sin(now * s.sp + s.tw) * 0.5 + 0.5) * 0.6;
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 30 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 26 * s, y + 4 * s, 22 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y + 6 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlatforms() {
    for (const p of platforms) {
      const sx = p.x - camX;
      if (sx + p.w < 0 || sx > W) continue;
      // 地表
      ctx.fillStyle = '#8bd45a';
      ctx.fillRect(sx, p.y, p.w, 18);
      ctx.fillStyle = '#c8853f';
      ctx.fillRect(sx, p.y + 18, p.w, Math.min(p.h - 18, H - (p.y + 18) + camX));
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      for (let i = 0; i < p.w; i += 34) {
        ctx.beginPath(); ctx.moveTo(sx + i, p.y + 18); ctx.lineTo(sx + i, p.y + p.h); ctx.stroke();
      }
    }
  }

  function drawItems() {
    for (const it of items) {
      if (it.taken) continue;
      const sx = it.x - camX;
      if (sx < -40 || sx > W + 40) continue;
      const bob = Math.sin((performance.now() + it.x * 10) / 260) * 6;
      ctx.font = 'bold 40px "Hiragino Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 6;
      ctx.strokeText(it.char, sx, it.y + bob);
      ctx.fillStyle = it.isDecoy ? '#ffd2d2' : '#ffe66b';
      ctx.fillText(it.char, sx, it.y + bob);
    }
    const gsx = GOAL_X - camX;
    if (gsx > -60 && gsx < W + 60) {
      ctx.font = '58px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('🏁', gsx + 30, GROUND_Y);
    }
  }

  function drawShots() {
    for (const b of shots) {
      const sx = b.x - camX;
      if (sx < -20 || sx > W + 20) continue;
      ctx.save();
      ctx.shadowColor = 'rgba(140, 230, 255, 0.9)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#9be9ff';
      ctx.beginPath();
      ctx.arc(sx, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFlyingChars() {
    for (const fc of flyingChars) {
      const sx = fc.x - camX;
      if (sx < -120 || sx > W + 120) continue;
      const alpha = Math.max(0, fc.life / fc.ttl);
      ctx.save();
      ctx.translate(sx, fc.y);
      ctx.rotate(fc.rot);
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${Math.round(fc.size)}px "Hiragino Sans", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 6;
      ctx.strokeText(fc.char, 0, 0);
      ctx.fillStyle = '#ffc2c2';
      ctx.fillText(fc.char, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawFailShinigamiFx() {
    if (gameState !== 'fail_anim') return;
    const cx = player.x + player.w * 0.5 - camX;
    const cy = player.y + player.h * 0.46;
    const t = performance.now() * 0.0012;
    const radius = 52 + Math.sin(t * 2.4) * 4;
    for (let i = 0; i < 3; i++) {
      const ang = t + i * (Math.PI * 2 / 3);
      const x = cx + Math.cos(ang) * radius;
      const y = cy + Math.sin(ang) * 22 - 26;
      const size = 34 + (Math.sin(t * 3 + i) * 0.5 + 0.5) * 6;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate(x, y);
      ctx.rotate(Math.sin(t * 2 + i) * 0.25);
      if (shinigamiImg.complete && shinigamiImg.naturalWidth > 0) {
        ctx.drawImage(shinigamiImg, -size * 0.5, -size * 0.5, size, size);
      } else {
        ctx.fillStyle = 'rgba(240,240,255,0.65)';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFireworks() {
    if (gameState !== 'success_anim') return;
    for (const r of fireRockets) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `hsla(${r.hue},100%,65%,0.9)`;
      ctx.fillStyle = `hsl(${r.hue} 100% 70%)`;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of fireParticles) {
      const alpha = Math.max(0, p.life / p.ttl);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsla(${p.hue},100%,70%,${alpha})`;
      ctx.fillStyle = `hsl(${p.hue} 100% 65%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 祝福テキスト
    const pulse = 0.8 + Math.sin(performance.now() * 0.01) * 0.2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `bold ${Math.round(36 * pulse)}px "Hiragino Sans", sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeStyle = 'rgba(255,120,120,0.7)';
    ctx.lineWidth = 6;
    ctx.strokeText('すごい！', W * 0.5, 22);
    ctx.fillText('すごい！', W * 0.5, 22);
    ctx.restore();
  }

  const CAT_RENDER_Y_OFFSET = 7.5; // 見た目のみさらに0.5px下方向

  function drawPlayer() {
    if (!sheet.complete || sheet.naturalWidth === 0) return;
    const row = ANIM[
      player.state === 'item' ? 'ITEM' :
      player.state === 'mash' ? 'MASH' :
      player.state === 'jump' ? 'JUMP' :
      player.state === 'crouch' ? 'CROUCH' : 'WALK'
    ];
    const col = player.animFrame;
    const sxSrc = col * FRAME, sySrc = row * FRAME;

    const dx = player.x - camX;
    const dy = player.y + CAT_RENDER_Y_OFFSET;
    const dw = player.w, dh = player.h;

    ctx.save();
    if (player.facing === -1) {
      ctx.translate(dx + dw / 2, 0);
      ctx.scale(-1, 1);
      ctx.translate(-(dx + dw / 2), 0);
    }
    ctx.drawImage(sheet, sxSrc, sySrc, FRAME, FRAME, dx, dy, dw, dh);
    ctx.restore();
  }

  function render() {
    drawBackground();
    drawFireworks();
    drawPlatforms();
    drawItems();
    drawShots();
    drawFlyingChars();
    drawPlayer();
    drawFailShinigamiFx();
  }

  /* =========================================================
     メインループ
  ========================================================= */
  function loop(now) {
    const dt = Math.min(now - lastT, 48);
    lastT = now;
    if (gameState === 'playing' || gameState === 'fail_anim' || gameState === 'success_anim') update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* =========================================================
     オーバーレイ / 開始・リスタート
  ========================================================= */
  const overlay = document.getElementById('overlay');
  const overlayH1 = overlay.querySelector('h1');
  const overlayPs = overlay.querySelectorAll('p');
  const startBtn = document.getElementById('startBtn');

  function showOverlay(title, sub, btnLabel) {
    overlayH1.textContent = title;
    overlayPs.forEach(p => p.style.display = 'none');
    let subP = overlay.querySelector('.subline');
    if (!subP) {
      subP = document.createElement('p');
      subP.className = 'subline';
      overlay.insertBefore(subP, startBtn);
    }
    subP.style.display = 'block';
    subP.style.whiteSpace = 'pre-line';
    subP.textContent = sub || '';
    startBtn.textContent = btnLabel || 'スタート';
    overlay.classList.remove('hidden');
  }

  function resetLevel() {
    player.x = 40; player.y = GROUND_Y - PLAYER_SIZE;
    player.vx = 0; player.vy = 0;
    player.mashModeT = 0; player.itemGlowT = 0;
    failAnimTimer = 0;
    failOverlayText = '';
    successAnimTimer = 0;
    successOverlayText = '';
    fireLaunchTimer = 0;
    fireRockets.length = 0;
    fireParticles.length = 0;
    bgmStep = 0;
    bgmTimer = 0;
    shotTimer = 0;
    shots.length = 0;
    flyingChars.length = 0;
    setupQuestion();
    camX = 0;
    showOverlay('問題', `お題: ${currentQuestion.word}\n正しい順番で4文字を集めて旗で判定！\nネコショットで不要な漢字は弾き飛ばせるよ。`, 'スタート');
  }

  startBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    unlockAudio();
    resetLevel();
    gameState = 'playing';
    overlay.classList.add('hidden');
  });

  resetLevel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
