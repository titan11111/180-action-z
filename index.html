<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no,
           viewport-fit=cover">
<title>アクションゲームZ</title>
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="アクションゲームZ">
<meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
<meta property="og:url" content="https://titan11111.github.io/180-action-z/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
</head>
<body>

<div id="screen">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div id="hearts">♥♥♥</div>
      <div>四字熟語: <span id="collectedWord">----</span></div>
      <div id="zoneLabel"></div>
    </div>
    <div id="modeLabel"></div>
    <button type="button" id="muteBtn">🔊</button>
  </div>

  <div id="mash-gauge-wrap"><div id="mash-gauge"></div></div>

  <div id="overlay">
    <h1>アクションゲームZ</h1>
    <p>← → で移動 / 十字下でしゃがみ</p>
    <p>A ボタンでジャンプ / B ボタン連打でねこが覚醒モード！</p>
    <p>敵は踏みつけて倒せる。漢字を4つ集めて四字熟語を完成させよう</p>
    <button id="startBtn" type="button">スタート</button>
  </div>

  <div id="controller">
    <div class="dpad">
      <button type="button" id="cv-up">▲</button>
      <button type="button" id="cv-down">▼</button>
      <button type="button" id="cv-left">◀</button>
      <button type="button" id="cv-right">▶</button>
    </div>
    <div class="action-btns">
      <button type="button" id="cv-a">A<small>ジャンプ</small></button>
      <button type="button" id="cv-b">B<small>連打で覚醒</small></button>
    </div>
  </div>

</div>

<script>
// 実行時エラーの可視化（真っ黒画面対策）
window.onerror = function (msg, src, line) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#900;color:#fff;font-size:12px;padding:6px 10px;';
  el.textContent = 'Error: ' + msg + ' (' + line + ')';
  document.body.appendChild(el);
};
</script>
<script src="config.js"></script>
<script src="audio.js"></script>
<script src="effects.js"></script>
<script src="enemies.js"></script>
<script src="main.js"></script>
</body>
</html>
