<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no,
           viewport-fit=cover">
<title>アクションゲームZ</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: none;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    font-family: "Hiragino Sans", "Helvetica Neue", sans-serif;
  }

  #screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #5c94fc;
  }

  /* ===== HUD ===== */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== タイトル / ゴール オーバーレイ ===== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 32px;
    margin: 0 0 8px;
    text-shadow: 3px 3px 0 #d43;
    letter-spacing: 2px;
  }
  #overlay p { margin: 4px 0; font-size: 15px; opacity: 0.9; }
  #overlay button {
    margin-top: 22px;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: bold;
    border: 3px solid #fff;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    touch-action: manipulation;
  }
  #overlay button:active { background: #c23350; }

  /* ===== ファミコン風コントローラー（下段25%） ===== */
  #controller {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 25vh;
    min-height: 130px;
    background: linear-gradient(#3a3f52, #23262f);
    border-top: 3px solid #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(22px + env(safe-area-inset-left));
    padding-right: calc(22px + env(safe-area-inset-right));
    z-index: 10;
  }

  /* 十字キー（左） */
  .dpad {
    position: relative;
    width: 140px;
    height: 140px;
    flex-shrink: 0;
  }
  .dpad button {
    position: absolute;
    width: 46px;
    height: 46px;
    background: #d8d8dc;
    border: 2px solid #16161a;
    color: #16161a;
    font-size: 20px;
    font-weight: bold;
    border-radius: 6px;
    padding: 0;
  }
  .dpad button:active { background: #9a9aa0; }
  #cv-up    { top: 0;   left: 47px; border-radius: 6px 6px 0 0; }
  #cv-down  { bottom: 0; left: 47px; border-radius: 0 0 6px 6px; }
  #cv-left  { top: 47px; left: 0;   border-radius: 6px 0 0 6px; }
  #cv-right { top: 47px; right: 0;  border-radius: 0 6px 6px 0; }

  /* A/Bボタン（右）: 右から A → B の並び */
  .action-btns {
    display: flex;
    flex-direction: row-reverse; /* 最初の要素(A)が右端に来る */
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .action-btns button {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: #e94560;
    border: 3px solid #7a1830;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    padding: 0;
  }
  .action-btns button:active { background: #b82f45; }
  .action-btns small { font-size: 9px; font-weight: normal; }
  #cv-b { background: #4b6cb7; border-color: #223a6b; margin-top: 16px; }
  #cv-b:active { background: #33508f; }

  #mash-gauge-wrap {
    position: absolute;
    bottom: calc(25vh + 8px);
    right: 22px;
    width: 90px;
    height: 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid #fff;
    border-radius: 5px;
    overflow: hidden;
    z-index: 6;
  }
  #mash-gauge {
    height: 100%;
    width: 0%;
    background: #4b6cb7;
  }

  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }
  @media (orientation: landscape) {
    #rotate-overlay { display: none; }
  }
  #rotate-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #000; color: #fff;
    flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 1.1rem; text-align: center;
    padding: 0 24px;
  }
</style>
</head>
<body>

<div id="screen">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div>🐟 <span id="score">0</span></div>
    <div id="modeLabel"></div>
  </div>

  <div id="mash-gauge-wrap"><div id="mash-gauge"></div></div>

  <div id="overlay">
    <h1>アクションゲームZ</h1>
    <p>← → で移動 / 十字下でしゃがみ</p>
    <p>A ボタンでジャンプ / B ボタン連打でねこが覚醒モード！</p>
    <p>🐟 を集めて 🏁 を目指せ</p>
    <button id="startBtn" type="button">スタート</button>
  </div>

  <div id="controller">
    <div class="dpad">
      <button type="button" id="cv-up">▲</button>
      <button type="button" id="cv-down">▼</button>
      <button type="button" id="cv-left">◀</button>
      <button type="button" id="cv-right">▶</button>
    </div>
    <div class="action-btns">
      <button type="button" id="cv-a">A<small>ジャンプ</small></button>
      <button type="button" id="cv-b">B<small>連打で覚醒</small></button>
    </div>
  </div>

  <div id="rotate-overlay">
    端末を横向きにしてください<br><small>Please rotate your device</small>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     ダブルタップ防止
  ========================================================= */
  let lastTap = 0;
  document.addEventListener('touchstart', e => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* =========================================================
     WebAudio（効果音: ジャンプ / 取得 / 覚醒モード）
  ========================================================= */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function unlockAudio() {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
  }
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });

  function beep(freq, dur, type, vol) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol == null ? 0.08 : vol;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.stop(ctx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }
  const sfx = {
    jump:  () => beep(520, 0.15, 'square', 0.09),
    item:  () => beep(880, 0.18, 'triangle', 0.10),
    mash:  () => beep(660, 0.22, 'sawtooth', 0.10),
    goal:  () => beep(392, 0.5, 'triangle', 0.12),
  };

  /* =========================================================
     入力
  ========================================================= */
  const K = {};
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    K[e.code] = true;
  });
  document.addEventListener('keyup', e => { K[e.code] = false; });

  function bindPointer(el, codes) {
    if (!el) return;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      codes.forEach(c => { K[c] = true; });
      unlockAudio();
    });
    el.addEventListener('pointerup',     () => { codes.forEach(c => { K[c] = false; }); });
    el.addEventListener('pointercancel', () => { codes.forEach(c => { K[c] = false; }); });
    el.addEventListener('lostpointercapture', () => { codes.forEach(c => { K[c] = false; }); });
  }

  function initVirtualControls() {
    bindPointer(document.getElementById('cv-left'),  ['ArrowLeft']);
    bindPointer(document.getElementById('cv-right'), ['ArrowRight']);
    bindPointer(document.getElementById('cv-up'),    ['ArrowUp']);
    bindPointer(document.getElementById('cv-down'),  ['ArrowDown']);
    bindPointer(document.getElementById('cv-a'),     ['KeyA_BTN', 'Space']);
    bindPointer(document.getElementById('cv-b'),     ['KeyB_BTN']);
  }
  initVirtualControls();

  /* =========================================================
     Canvas / DPR
  ========================================================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  /* =========================================================
     スプライトシート（5x5: 1歩行 2ジャンプ 3しゃがみ 4アイテム取得 5覚醒モード）
  ========================================================= */
  const sheet = new Image();
  sheet.src = 'cat-sprite.png';
  const SHEET_SIZE = 1024;
  const COLS = 5, ROWS = 5;
  const FRAME = SHEET_SIZE / COLS; // 204.8

  const ANIM = { WALK: 0, JUMP: 1, CROUCH: 2, ITEM: 3, MASH: 4 };

  /* =========================================================
     ワールド定義
  ========================================================= */
  const GRAVITY = 0.62;
  const JUMP_V = -13.4;
  const MOVE_SPEED = 3.1;
  const MASH_SPEED_MUL = 1.55;
  const GROUND_Y = 420; // ワールド座標での地面上端

  // 地形: {x,w,y,h} y=上端。 通常地面 + 浮島 + 崖ギャップ
  const platforms = [
    { x: -50,  w: 480,  y: GROUND_Y, h: 400 },
    { x: 560,  w: 260,  y: GROUND_Y, h: 400 },
    { x: 900,  w: 160,  y: GROUND_Y - 90, h: 20 },
    { x: 1140, w: 380,  y: GROUND_Y, h: 400 },
    { x: 1650, w: 140,  y: GROUND_Y - 130, h: 20 },
    { x: 1900, w: 140,  y: GROUND_Y - 60,  h: 20 },
    { x: 2140, w: 520,  y: GROUND_Y, h: 400 },
    { x: 2760, w: 180,  y: GROUND_Y - 100, h: 20 },
    { x: 3020, w: 700,  y: GROUND_Y, h: 400 },
  ];
  const LEVEL_WIDTH = 3720;
  const GOAL_X = 3600;

  const items = [
    { x: 300,  y: GROUND_Y - 60, taken: false },
    { x: 640,  y: GROUND_Y - 60, taken: false },
    { x: 970,  y: GROUND_Y - 150, taken: false },
    { x: 1220, y: GROUND_Y - 60, taken: false },
    { x: 1400, y: GROUND_Y - 60, taken: false },
    { x: 1710, y: GROUND_Y - 190, taken: false },
    { x: 1960, y: GROUND_Y - 120, taken: false },
    { x: 2220, y: GROUND_Y - 60, taken: false },
    { x: 2450, y: GROUND_Y - 60, taken: false },
    { x: 2820, y: GROUND_Y - 160, taken: false },
    { x: 3100, y: GROUND_Y - 60, taken: false },
    { x: 3300, y: GROUND_Y - 60, taken: false },
  ];

  const clouds = [];
  for (let i = 0; i < 10; i++) {
    clouds.push({ x: i * 420 + Math.random() * 150, y: 60 + Math.random() * 140, s: 0.7 + Math.random() * 0.8 });
  }

  /* =========================================================
     プレイヤー状態
  ========================================================= */
  const player = {
    x: 40, y: GROUND_Y - 90, w: 66, h: 66,
    vx: 0, vy: 0,
    grounded: false,
    facing: 1,      // 1: 右向き, -1: 左向き
    animTimer: 0,
    animFrame: 0,
    state: 'walk',  // walk | jump | crouch
    itemGlowT: 0,
    mashModeT: 0,
  };

  let score = 0;
  let gameState = 'title'; // title | playing | goal
  let camX = 0;

  // 覚醒モード（Bボタン連打）検知
  let prevB = false;
  const mashPresses = [];
  const MASH_WINDOW = 900;
  const MASH_THRESHOLD = 4;
  const MASH_MODE_DURATION = 3200;

  function updateMashDetection(dt) {
    const bDown = !!K['KeyB_BTN'];
    if (bDown && !prevB) {
      const now = performance.now();
      mashPresses.push(now);
      while (mashPresses.length && now - mashPresses[0] > MASH_WINDOW) mashPresses.shift();
      if (mashPresses.length >= MASH_THRESHOLD && player.mashModeT <= 0) {
        player.mashModeT = MASH_MODE_DURATION;
        sfx.mash();
        mashPresses.length = 0;
      }
    }
    prevB = bDown;

    const gaugeEl = document.getElementById('mash-gauge');
    if (player.mashModeT > 0) {
      gaugeEl.style.width = '100%';
      gaugeEl.style.background = '#7fd3ff';
    } else {
      const now = performance.now();
      while (mashPresses.length && now - mashPresses[0] > MASH_WINDOW) mashPresses.shift();
      gaugeEl.style.width = Math.min(100, (mashPresses.length / MASH_THRESHOLD) * 100) + '%';
      gaugeEl.style.background = '#4b6cb7';
    }

    if (player.mashModeT > 0) {
      player.mashModeT -= dt;
      if (player.mashModeT < 0) player.mashModeT = 0;
    }
  }

  /* =========================================================
     衝突判定（簡易AABB・上面着地のみ）
  ========================================================= */
  function resolveGround() {
    player.grounded = false;
    for (const p of platforms) {
      const withinX = player.x + player.w * 0.5 > p.x && player.x + player.w * 0.5 < p.x + p.w;
      const feetY = player.y + player.h;
      if (withinX && player.vy >= 0 && feetY >= p.y && feetY <= p.y + 24) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  function checkItems() {
    for (const it of items) {
      if (it.taken) continue;
      const dx = (player.x + player.w / 2) - it.x;
      const dy = (player.y + player.h / 2) - it.y;
      if (Math.abs(dx) < 42 && Math.abs(dy) < 42) {
        it.taken = true;
        score++;
        document.getElementById('score').textContent = score;
        player.itemGlowT = 500;
        sfx.item();
      }
    }
  }

  /* =========================================================
     更新
  ========================================================= */
  let lastT = performance.now();

  function update(dt) {
    updateMashDetection(dt);

    const left = !!K['ArrowLeft'];
    const right = !!K['ArrowRight'];
    const down = !!K['ArrowDown'];
    const jumpPressed = !!K['KeyA_BTN'];

    const speed = MOVE_SPEED * (player.mashModeT > 0 ? MASH_SPEED_MUL : 1);
    let moving = false;

    if (left && !right) { player.vx = -speed; player.facing = -1; moving = true; }
    else if (right && !left) { player.vx = speed; player.facing = 1; moving = true; }
    else { player.vx = 0; }

    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x > LEVEL_WIDTH - player.w) player.x = LEVEL_WIDTH - player.w;

    // 重力
    player.vy += GRAVITY;
    player.y += player.vy;
    resolveGround();

    // ジャンプ（Aボタン / Space）
    if (jumpPressed && player.grounded) {
      player.vy = JUMP_V;
      player.grounded = false;
      sfx.jump();
    }

    // 落下したら復帰
    if (player.y > 900) {
      player.x = 40; player.y = GROUND_Y - 90; player.vx = 0; player.vy = 0;
    }

    checkItems();

    // 状態決定（優先度: アイテム取得 > 覚醒モード > ジャンプ > しゃがみ > 歩行）
    if (player.itemGlowT > 0) {
      player.itemGlowT -= dt;
      player.state = 'item';
    } else if (player.mashModeT > 0) {
      player.state = 'mash';
    } else if (!player.grounded) {
      player.state = 'jump';
    } else if (down && !moving) {
      player.state = 'crouch';
    } else {
      player.state = 'walk';
    }

    // アニメーションフレーム送り
    const animSpeed = moving ? 90 : 220;
    player.animTimer += dt;
    if (player.animTimer > animSpeed) {
      player.animTimer = 0;
      player.animFrame = (player.animFrame + 1) % COLS;
    }
    if (player.state === 'walk' && !moving) player.animFrame = 0; // 立ち止まりは1コマ目

    document.getElementById('modeLabel').textContent = player.mashModeT > 0 ? '✨覚醒モード✨' : '';

    // カメラ
    const targetCamX = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.4));
    camX += (targetCamX - camX) * 0.15;

    // ゴール判定
    if (gameState === 'playing' && player.x >= GOAL_X) {
      gameState = 'goal';
      sfx.goal();
      showOverlay('🏁 ゴール！', `🐟 ${score} / ${items.length} 匹集めた！`, 'もういちど遊ぶ');
    }
  }

  /* =========================================================
     描画
  ========================================================= */
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#7ec8ff');
    g.addColorStop(1, '#c9ecff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    for (const c of clouds) {
      const sx = c.x - camX * 0.4;
      if (sx < -120 || sx > W + 120) continue;
      drawCloud(sx, c.y, c.s);
    }
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 30 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 26 * s, y + 4 * s, 22 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y + 6 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlatforms() {
    for (const p of platforms) {
      const sx = p.x - camX;
      if (sx + p.w < 0 || sx > W) continue;
      // 地表
      ctx.fillStyle = '#8bd45a';
      ctx.fillRect(sx, p.y, p.w, 18);
      ctx.fillStyle = '#c8853f';
      ctx.fillRect(sx, p.y + 18, p.w, Math.min(p.h - 18, H - (p.y + 18) + camX));
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      for (let i = 0; i < p.w; i += 34) {
        ctx.beginPath(); ctx.moveTo(sx + i, p.y + 18); ctx.lineTo(sx + i, p.y + p.h); ctx.stroke();
      }
    }
  }

  function drawItems() {
    for (const it of items) {
      if (it.taken) continue;
      const sx = it.x - camX;
      if (sx < -40 || sx > W + 40) continue;
      const bob = Math.sin((performance.now() + it.x * 10) / 260) * 6;
      ctx.font = '34px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐟', sx, it.y + bob);
    }
    const gsx = GOAL_X - camX;
    if (gsx > -60 && gsx < W + 60) {
      ctx.font = '58px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('🏁', gsx + 30, GROUND_Y);
    }
  }

  function drawPlayer() {
    if (!sheet.complete || sheet.naturalWidth === 0) return;
    const row = ANIM[
      player.state === 'item' ? 'ITEM' :
      player.state === 'mash' ? 'MASH' :
      player.state === 'jump' ? 'JUMP' :
      player.state === 'crouch' ? 'CROUCH' : 'WALK'
    ];
    const col = player.animFrame;
    const sxSrc = col * FRAME, sySrc = row * FRAME;

    const dx = player.x - camX;
    const dy = player.y;
    const dw = player.w, dh = player.h;

    ctx.save();
    if (player.facing === -1) {
      ctx.translate(dx + dw / 2, 0);
      ctx.scale(-1, 1);
      ctx.translate(-(dx + dw / 2), 0);
    }
    ctx.drawImage(sheet, sxSrc, sySrc, FRAME, FRAME, dx, dy, dw, dh);
    ctx.restore();
  }

  function render() {
    drawBackground();
    drawPlatforms();
    drawItems();
    drawPlayer();
  }

  /* =========================================================
     メインループ
  ========================================================= */
  function loop(now) {
    const dt = Math.min(now - lastT, 48);
    lastT = now;
    if (gameState === 'playing') update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* =========================================================
     オーバーレイ / 開始・リスタート
  ========================================================= */
  const overlay = document.getElementById('overlay');
  const overlayH1 = overlay.querySelector('h1');
  const overlayPs = overlay.querySelectorAll('p');
  const startBtn = document.getElementById('startBtn');

  function showOverlay(title, sub, btnLabel) {
    overlayH1.textContent = title;
    overlayPs.forEach(p => p.style.display = 'none');
    let subP = overlay.querySelector('.subline');
    if (!subP) {
      subP = document.createElement('p');
      subP.className = 'subline';
      overlay.insertBefore(subP, startBtn);
    }
    subP.style.display = 'block';
    subP.textContent = sub || '';
    startBtn.textContent = btnLabel || 'スタート';
    overlay.classList.remove('hidden');
  }

  function resetLevel() {
    player.x = 40; player.y = GROUND_Y - 90;
    player.vx = 0; player.vy = 0;
    player.mashModeT = 0; player.itemGlowT = 0;
    score = 0;
    document.getElementById('score').textContent = '0';
    items.forEach(it => it.taken = false);
    camX = 0;
  }

  startBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    unlockAudio();
    resetLevel();
    gameState = 'playing';
    overlay.classList.add('hidden');
  });

  requestAnimationFrame(loop);
  window.__dbg = { player, get gameState(){ return gameState; }, items, score: () => score };
})();
</script>
</body>
</html>
